<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlantenAcademie</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🌿 PlantenAcademie</h1>
    <nav>
      <button class="nav-btn actief" onclick="openTab('herbarium')">📚 Herbarium</button>
      <button class="nav-btn" onclick="openTab('flashcards')">🎴 Flashcards</button>
      <button class="nav-btn" onclick="openTab('quiz')">🧠 Quiz</button>
      <button class="nav-btn" onclick="openTab('beheer')">⚙️ Beheer</button>
    </nav>
  </header>

  <main>
    <!-- HERBARIUM -->
    <section id="herbarium" class="tab-content actief">
      <h2>Digital Herbarium</h2>
      <div class="filter-bar">
        <input type="text" id="zoekHerbarium" placeholder="Zoek op plantennaam..." oninput="filterHerbarium()">
      </div>

      <!-- Alfabet Filterbalk -->
      <div class="alfabet-balk" id="alfabetBalk"></div>

      <div id="herbariumGrid" class="grid-container"></div>
    </section>

    <!-- FLASHCARDS -->
    <section id="flashcards" class="tab-content">
      <h2>Flashcards Stampen</h2>
      <p>Klik op de kaart om de achterkant te bekijken.</p>
      <div class="flashcard-container">
        <div id="flashcard" class="card" onclick="draaiFlashcardOm()">
          <div id="flashcardInhoud">Klik om te starten</div>
        </div>
        <div class="card-controls">
          <button onclick="vorigeFlashcard()">⬅ Vorige</button>
          <span id="flashcardTeller">0 / 0</span>
          <button onclick="volgendeFlashcard()">Volgende ➡</button>
        </div>
      </div>
    </section>

    <!-- QUIZ -->
    <section id="quiz" class="tab-content">
      <h2>Plantekennis Quiz</h2>
      <div id="quizContainer">
        <p id="quizVraag">Druk op start om de quiz te beginnen!</p>
        <div id="quizOpties" class="quiz-opties"></div>
        <button id="startQuizBtn" onclick="startQuiz()">Start Quiz</button>
      </div>
    </section>

    <!-- BEHEER -->
    <section id="beheer" class="tab-content">
      <h2>Plant Toevoegen aan Database</h2>
      <form id="plantForm" onsubmit="voegPlantToe(event)">
        <div class="form-group">
          <label for="naam">Nederlandse Naam:</label>
          <input type="text" id="naam" required placeholder="bijv. Duizendblad">
        </div>

        <div class="form-group">
          <label for="wetenschappelijk">Wetenschappelijke Naam:</label>
          <input type="text" id="wetenschappelijk" placeholder="bijv. Achillea millefolium">
        </div>

        <div class="form-group">
          <label for="bladvorm">Bladvorm:</label>
          <input type="text" id="bladvorm" list="bladvorm-opties" placeholder="Kies of typ bladvorm...">
          <datalist id="bladvorm-opties">
            <option value="Veerdelig">
            <option value="Handvormig">
            <option value="Eivormig">
            <option value="Lancetvormig">
            <option value="Lijnvormig">
          </datalist>
        </div>

        <div class="form-group">
          <label for="bladrand">Bladrand:</label>
          <input type="text" id="bladrand" list="bladrand-opties" placeholder="Kies of typ bladrand...">
          <datalist id="bladrand-opties">
            <option value="Gekarteld">
            <option value="Gezaagd">
            <option value="Gaanrandig">
            <option value="Ingesneden">
          </datalist>
        </div>

        <div class="form-group">
          <label for="vrucht">Vrucht / Zaad:</label>
          <input type="text" id="vrucht" placeholder="bijv. Nootje, Bes, Doosvrucht">
        </div>

        <div class="form-group">
          <label for="bloeitijd">Bloeitijd:</label>
          <input type="text" id="bloeitijd" placeholder="bijv. Juni – September">
        </div>

        <div class="form-group">
          <label for="categorie">Categorie:</label>
          <input type="text" id="categorie" list="categorie-opties" placeholder="Kies of typ categorie...">
          <datalist id="categorie-opties">
            <option value="Vaste plant">
            <option value="Sierheester">
            <option value="Kamerplant">
            <option value="Boom">
            <option value="Eenjarige">
          </datalist>
        </div>

        <div class="form-group">
          <label for="standplaats">Standplaats:</label>
          <input type="text" id="standplaats" list="standplaats-opties" placeholder="Kies of typ standplaats...">
          <datalist id="standplaats-opties">
            <option value="Zonnig (volle zon)">
            <option value="Halfschaduw">
            <option value="Schaduw">
            <option value="Zonnig tot halfschaduw">
            <option value="Halfschaduw tot schaduw">
          </datalist>
        </div>

        <div class="form-group">
          <label for="bodemtype">Bodemtype:</label>
          <input type="text" id="bodemtype" list="bodemtype-opties" placeholder="Kies of typ bodemtype...">
          <datalist id="bodemtype-opties">
            <option value="Goed doorlatend">
            <option value="Humusrijk / Voedselrijk">
            <option value="Zandgrond">
            <option value="Klei / Zware klei">
            <option value="Zuurminnend / Bosgrond">
            <option value="Natte / Vochtige grond">
            <option value="Droge tot matig vochtige grond">
          </datalist>
        </div>

        <div class="form-group">
          <label for="bladbehoud">Bladbehoud:</label>
          <input type="text" id="bladbehoud" list="bladbehoud-opties" placeholder="Kies of typ bladbehoud...">
          <datalist id="bladbehoud-opties">
            <option value="Bladverliezend">
            <option value="Groenblijvend (Sierheester/Vaste plant)">
            <option value="Half-groenblijvend">
            <option value="Naaldblijvend (Conifeer)">
          </datalist>
        </div>

        <div class="form-group">
          <label for="waterbehoefte">Waterbehoefte:</label>
          <input type="text" id="waterbehoefte" placeholder="bijv. Laag, Gemiddeld, Hoog">
        </div>

        <div class="form-group">
          <label for="vermeerderen">Vermeerderen:</label>
          <input type="text" id="vermeerderen" placeholder="bijv. Delen, Stekken, Zaaien">
        </div>

        <div class="form-group">
          <label for="grootte">Maximale Grootte:</label>
          <input type="text" id="grootte" placeholder="bijv. 40 - 80 cm">
        </div>

        <div class="form-group">
          <label for="foto">Foto URL:</label>
          <input type="url" id="foto" placeholder="https://images.unsplash.com/...">
        </div>

        <div class="form-group full-width">
          <label for="beschrijving">Beschrijving / Extra Notities / Weetje:</label>
          <textarea id="beschrijving" rows="4" placeholder="Schrijf hier extra informatie of een weetje..."></textarea>
        </div>

        <button type="submit" class="submit-btn">Plant Opslaan</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
